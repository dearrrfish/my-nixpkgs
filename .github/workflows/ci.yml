name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  modules:
    name: Modules and flake checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v14
        with:
          name: dearrrfish
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Evaluate module interfaces on every supported system
        shell: bash
        run: |
          set -euo pipefail
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            nix eval ".#checks.$system.module-eval.drvPath" --raw
          done
      - name: Build Linux checks, activation fixtures and option documentation
        run: nix flake check --print-build-logs
      - name: Smoke-test the packaged management CLI
        run: |
          nix build '.#packages.x86_64-linux."as/askhuman"' --out-link askhuman-cli
          ./askhuman-cli/bin/AskHuman --help
          ./askhuman-cli/bin/AskHuman config --help
  build:
    name: Packages (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on runner
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v14
        with:
          name: dearrrfish
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build All Packages
        shell: bash
        run: |
          set -euo pipefail
          nix eval .#packages.x86_64-linux --apply builtins.attrNames --json \
            | jq -r '.[]' \
            | xargs -I {} nix build ".#packages.x86_64-linux.\"{}\"" --no-link --print-build-logs
